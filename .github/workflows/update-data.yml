name: Update Oncomap Data

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch:       # allow manual trigger

# Allow the workflow to push data back to the repo
permissions:
  contents: write

env:
  # Fix: opt into Node.js 24 now, before it becomes mandatory on 2026-06-16
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Oncomap API data
        # The API at api.oncomap.de only accepts browser-originated requests.
        # We simulate that with Origin + Referer headers and add retry logic.
        # If the server still blocks GitHub Actions IPs, see TROUBLESHOOTING below.
        run: |
          set -euo pipefail
          mkdir -p data

          fetch() {
            local name="$1"
            local url="$2"
            echo "Fetching ${name}…"
            curl \
              --silent --show-error --fail \
              --retry 4 \
              --retry-delay 10 \
              --retry-connrefused \
              --retry-all-errors \
              --max-time 60 \
              --connect-timeout 15 \
              -H "Origin: https://oncomap.de" \
              -H "Referer: https://oncomap.de/" \
              -H "User-Agent: Mozilla/5.0 (compatible; GitHubActions/fetch-and-cache)" \
              "$url" \
              -o "data/${name}.json"
            echo "  OK – $(wc -c < "data/${name}.json") bytes"
          }

          fetch fulldb_clinics         "https://api.oncomap.de/api/direct/fulldb_clinics"
          fetch fulldb_centers         "https://api.oncomap.de/api/direct/fulldb_centers"
          fetch fulldb_oncos           "https://api.oncomap.de/api/direct/fulldb_oncos"
          fetch fulldb_viszes          "https://api.oncomap.de/api/direct/fulldb_viszes"
          fetch fulldb_uros            "https://api.oncomap.de/api/direct/fulldb_uros"
          fetch fulldb_partners        "https://api.oncomap.de/api/direct/fulldb_partners"
          fetch fulldb_oncos_centers   "https://api.oncomap.de/api/direct/fulldb_oncos_centers"
          fetch fulldb_viszes_centers  "https://api.oncomap.de/api/direct/fulldb_viszes_centers"
          fetch fulldb_uros_centers    "https://api.oncomap.de/api/direct/fulldb_uros_centers"
          fetch fulldb_partners_centers "https://api.oncomap.de/api/direct/fulldb_partners_centers"

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update oncomap data [skip ci]"
            git push
          fi

# ─── TROUBLESHOOTING ────────────────────────────────────────────────────────
#
# If the job still fails with exit code 7 (connection refused) even after the
# Origin/Referer headers above, the API is blocking GitHub-hosted runner IPs
# at the firewall level. In that case you have three options:
#
# Option A – Self-hosted runner
#   Run the job on your own server whose IP is allowed by the API.
#   Change `runs-on: ubuntu-latest` → `runs-on: self-hosted`.
#
# Option B – Whitelist GitHub Actions IP ranges
#   Ask the oncomap.de API team to allowlist GitHub's IP ranges:
#   https://api.github.com/meta  (look for the "actions" CIDR list)
#
# Option C – Proxy the API through your own backend
#   Set up a lightweight reverse-proxy (Cloudflare Worker, Vercel function, etc.)
#   on a whitelisted domain and point the fetch() calls there instead.
#
# ────────────────────────────────────────────────────────────────────────────
